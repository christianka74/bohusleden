<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bohusleden – Mina etapper</title>

<style>
:root{--green:#183d2b;--green2:#2d6849;--cream:#f5f1e8;--card:#fff;--text:#1d2922;--muted:#68746d;--line:#dfe5df;--done:#dff0e4}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

header{
  background:linear-gradient(145deg,#163c2a,#2f6b4b);
  color:white;
  padding:20px 18px 24px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 3px 14px #0002
}

.wrap{
  max-width:760px;
  margin:auto
}

/* NYTT: Bild + rubrik */
.title-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.title-image{
  width:174px;
  height:116px;
  object-fit:cover;
  border-radius:10px;
  flex:0 0 auto;
  border:2px solid #ffffff55;
}

h1{
  margin:0 0 5px;
  font-size:28px
}

.sub{
  opacity:.86;
  font-size:14px
}

.progress{
  margin-top:18px;
  background:#ffffff25;
  border-radius:16px;
  padding:13px
}

.p-row{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  font-size:14px
}

.bar{
  height:9px;
  background:#ffffff35;
  border-radius:10px;
  overflow:hidden;
  margin-top:9px
}

.fill{
  height:100%;
  width:0;
  background:#fff;
  border-radius:10px;
  transition:.25s
}

main{
  padding:16px 14px 34px
}

.toolbar{
  display:flex;
  gap:9px;
  margin-bottom:13px
}

.toolbar button{
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:10px 13px;
  font-weight:650;
  color:var(--text);
  cursor:pointer
}

.toolbar button:first-child{
  flex:1
}

.list{
  display:grid;
  gap:10px
}

.stage{
  display:flex;
  align-items:center;
  gap:13px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  box-shadow:0 1px 3px #00000008;
  transition:.2s
}

.stage.done{
  background:var(--done);
  border-color:#b9ddc4
}

.check{
  width:25px;
  height:25px;
  accent-color:var(--green2);
  flex:0 0 auto
}

.info{
  min-width:0;
  flex:1
}

.num{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em
}

.name{
  font-size:17px;
  font-weight:750;
  line-height:1.25;
  margin-top:2px
}

.meta{
  font-size:13px;
  color:var(--muted);
  margin-top:4px
}

.done .name{
  text-decoration:line-through;
  text-decoration-thickness:1px
}

.badge{
  font-size:12px;
  font-weight:750;
  color:var(--green2);
  white-space:nowrap
}

.stage:not(.done) .badge{
  display:none
}

.date-wrap{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:var(--muted)
}

.date-wrap input{
  border:1px solid var(--line);
  border-radius:8px;
  padding:5px 7px;
  background:white;
  color:var(--text);
  font:inherit
}

.done .date-wrap input{
  background:#f7fff9;
  border-color:#b9ddc4
}

footer{
  max-width:760px;
  margin:auto;
  padding:0 16px 30px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}

.source{
  margin-top:12px
}

.source a{
  color:var(--green2)
}

@media(min-width:600px){
  main{
    padding-left:20px;
    padding-right:20px
  }

  .stage{
    padding:15px 17px
  }
}
</style>

<script>

const stages=[
[1,'Älvsåker–Stensjön','26 km','7–8 h','Blå'],
[2,'Stensjön–Skatås','9 km','3 h'],
[3,'Skatås–Kåsjön','10 km','3–4 h'],
[4,'Kåsjön–Jonsered','8 km','3 h'],
[5,'Jonsered–Angereds kyrka','12 km','5 h'],
[6,'Angereds kyrka–Fontin','17 km','5–6 h'],
[7,'Fontin–Grandalen','16 km','6–7 h'],
[8,'Grandalen–Bottenstugan','8,5 km','3–4 h'],
[9,'Bottenstugan–Lysevatten','12 km','4–5 h'],
[10,'Lysevatten–Hasteröd','12 km','4–5 h'],
[11,'Hasteröd–Vassbovik','22 km','6–7 h'],
[12,'Vassbovik–Glimmingen','12 km','5 h'],
[13,'Glimmingen–Bjursjön','12 km','5 h'],
[14,'Bjursjön–Metsjö','13 km','4 h'],
[15,'Metsjö–Kaserna','17 km','6–7 h'],
[16,'Kaserna–Borgmästarbruket','6 km','2–3 h'],
[17,'Borgmästarbruket–Kyrkoryr','11 km','3–4 h'],
[18,'Kyrkoryr–Kynnefjälls natur','10 km','3–4 h'],
[19,'Kynnefjälls natur–Vaktarekullen','16 km','5–6 h'],
[20,'Vaktarekullen–Flötemarksön','12 km','5 h'],
[21,'Flötemarksön–Porsås','14 km','5–6 h'],
[22,'Porsås–Nornäs','7 km','3 h'],
[23,'Nornäs–Vassbotten','13 km','5–6 h'],
[24,'Vassbotten–Håvedalen','19 km','7–8 h'],
[25,'Håvedalen–Krokstrand','11 km','3 h'],
[26,'Krokstrand–Högstad','13 km','5–6 h'],
[27,'Högstad–Strömstad','15 km','5 h']
];

const KEY='bohusleden-progress-v2';
const DB_NAME='BohusledenApp';
const DB_STORE='state';

let state={};
let onlyDone=false;
let storageMode='localStorage';

function localLoad(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
    const old=JSON.parse(localStorage.getItem('bohusleden-done-v1')||'[]');
    if(Array.isArray(old)){
      const s={};
      old.forEach(n=>s[n]={date:''});
      return s;
    }
  }catch(e){}
  return null;
}

function openDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)) return reject(new Error('IndexedDB saknas'));
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{
      req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

async function idbLoad(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readonly');
    const req=tx.objectStore(DB_STORE).get(KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}

async function idbSave(value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(value,KEY);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

async function loadState(){
  let loaded=localLoad();
  if(loaded){
    state=loaded;
    storageMode='localStorage';
    return;
  }
  try{
    loaded=await idbLoad();
    if(loaded){
      state=loaded;
      storageMode='IndexedDB';
      return;
    }
  }catch(e){}
  state={};
}

async function save(){
  const value=JSON.stringify(state);
  try{
    localStorage.setItem(KEY,value);
    storageMode='localStorage';
  }catch(e){
    try{
      await idbSave(state);
      storageMode='IndexedDB';
    }catch(err){}
  }
  const status=document.getElementById('save-status');
  if(status) status.textContent='Sparat automatiskt';
  render();
}

function today(){
  return new Date().toISOString().slice(0,10)
}

function toggle(n, checked){
  if(checked)
    state[n]=state[n]||{date:today()};
  else
    delete state[n];

  save()
}

function setDate(n,date){
  if(state[n])
    state[n].date=date;

  save()
}

function formatDate(date){
  if(!date) return '';

  const parts=date.split('-');

  return parts.length===3
    ? `${parts[2]}-${parts[1]}-${parts[0]}`
    : date;
}

function render(){

  const list=document.getElementById('list');

  list.innerHTML='';

  stages
    .filter(s=>!onlyDone||state[s[0]])
    .forEach(s=>{

      const d=!!state[s[0]];

      const date=d
        ? (state[s[0]].date||'')
        : '';

      const el=document.createElement('div');

      el.className='stage'+(d?' done':'');

      el.innerHTML=`

        <input
          class="check"
          type="checkbox"
          ${d?'checked':''}
          aria-label="Etapp ${s[0]} genomförd"
        >

        <div class="info">

          <div class="num">
            Etapp ${s[0]}
          </div>

          <div class="name">
            ${s[1]}
          </div>

          <div class="meta">
            ${s[2]} · cirka ${s[3]}
          </div>

          ${d
            ? `<div class="date-wrap">
                 <span>Gick:</span>
                 <input
                   class="date"
                   type="date"
                   value="${date}"
                   aria-label="Datum då etappen gick"
                 >
               </div>`
            : ''
          }

        </div>

        <div class="badge">
          ✓ Gången
        </div>
      `;

      el
        .querySelector('.check')
        .addEventListener(
          'change',
          e=>toggle(s[0],e.target.checked)
        );

      const dateInput=el.querySelector('.date');

      if(dateInput)
        dateInput.addEventListener(
          'change',
          e=>setDate(s[0],e.target.value)
        );

      list.appendChild(el)

    });

  const n=Object.keys(state).length;

  const p=Math.round(n/stages.length*100);

  document.getElementById('count').textContent=
    `${n} av ${stages.length} etapper`;

  document.getElementById('percent').textContent=
    p+' %';

  document.getElementById('fill').style.width=
    p+'%';

  document.getElementById('filter').textContent=
    onlyDone
      ? 'Visa alla'
      : 'Visa genomförda'
}

document.getElementById('filter').onclick=()=>{
  onlyDone=!onlyDone;
  render()
};

loadState().then(()=>{
  render();
}).catch(()=>{
  state={};
  render();
});

</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
  });
}
</script>
